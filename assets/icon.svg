<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Grade de 2 unidades = 1 px no ícone de 16 px -->
  <!-- Slide -->
  <rect x="3" y="5" width="26" height="22" rx="2" fill="#FFFFFF" stroke="#3D3D3D" stroke-width="2"/>
  <!-- Sumário: seção passada, atual (destaque) e futura -->
  <rect x="6" y="10" width="6" height="4" rx="1" fill="#8A8A8A"/>
  <rect x="14" y="10" width="6" height="4" rx="1" fill="#333333"/>
  <rect x="22" y="10" width="4" height="4" rx="1" fill="#C4C4C4"/>
  <!-- Linha de progresso -->
  <rect x="6" y="20" width="20" height="4" rx="2" fill="#E3E3E3"/>
  <rect x="6" y="20" width="12" height="4" rx="2" fill="#BA7517"/>
</svg>
